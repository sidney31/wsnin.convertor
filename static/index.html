<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>К3 → ASAI Nest</title>
<style>
  @font-face { font-family: "Golos Text"; font-weight: 400 700; font-display: swap;
    src: url("static/fonts/golos-cyrillic.woff2") format("woff2");
    unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; }
  @font-face { font-family: "Golos Text"; font-weight: 400 700; font-display: swap;
    src: url("static/fonts/golos-latin.woff2") format("woff2");
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

  :root {
    --ground: #ECEDEB;
    --board: #F7F7F5;
    --ink: #1B1D1F;
    --ink-3: #62676B;
    --line: #C9CCCB;
    --mark: #34558B;
    --err: #A3271F;
    --ease: cubic-bezier(.16, 1, .3, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--ground); color: var(--ink);
    font: 400 16px/1.5 "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    display: grid; place-items: center; padding: 48px 16px; }
  ::selection { background: #C9D5E8; }
  :focus-visible { outline: 2px solid var(--mark); outline-offset: 4px; }

  main { width: 100%; max-width: 520px; }

  .drop { position: relative; width: 100%; min-height: 260px; padding: 40px 32px;
    background: var(--board); border: 1px solid var(--line); border-radius: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    text-align: center; font: inherit; color: inherit; cursor: pointer; overflow: hidden;
    transition: border-color .2s var(--ease), background-color .2s var(--ease); }
  .drop::before { content: ""; position: absolute; top: 18px; left: 18px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--ground); box-shadow: inset 0 1px 2px rgba(0,0,0,.28); }
  .drop:hover, .drop.over { border-color: #9DA2A1; background: #FBFBFA; }
  .drop.over { border-color: var(--mark); }
  .drop:disabled { cursor: progress; }
  .drop svg { color: var(--ink-3); margin-bottom: 10px; }
  .drop strong { font-size: 1.25rem; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .drop span { color: var(--ink-3); font-size: .9375rem; }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; width: 30%; background: var(--mark);
    animation: slide 1.1s var(--ease) infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }

  .get { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    margin-top: 16px; padding: 16px 20px; border-radius: 10px; background: var(--ink); color: #fff;
    font-weight: 600; font-size: 1.0625rem; text-decoration: none;
    transition: background-color .15s var(--ease); }
  .get:hover { background: #33373B; }

  .msg { margin: 16px 0 0; min-height: 24px; text-align: center; font-size: .9375rem; color: var(--ink-3); }
  .msg.err { color: var(--err); font-weight: 500; }

  @media (prefers-reduced-motion: reduce) {
    .bar i { animation: none; left: 0; width: 100%; opacity: .6; }
    .drop, .get { transition: none; }
  }
</style>
</head>
<body>
<main>
  <button class="drop" id="drop" type="button">
    <svg id="icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V4M7 9l5-5 5 5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
    <strong id="head">Перетащите базу заказа К3</strong>
    <span id="sub">или нажмите, чтобы выбрать .mdb</span>
    <div class="bar" id="bar" hidden aria-hidden="true"><i></i></div>
  </button>
  <input id="input" type="file" accept=".mdb,.accdb" hidden>
  <a class="get" id="get" hidden>
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    <span id="getText">Скачать</span>
  </a>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const drop = $("drop"), input = $("input"), get = $("get"), msg = $("msg");
let busy = false, url = null;

const stem = (name) => name.replace(/\.[^.]+$/, "");
const size = (n) => n >= 1048576 ? (n / 1048576).toFixed(1).replace(".", ",") + " МБ" : Math.max(1, Math.round(n / 1024)) + " КБ";

function view(head, sub, { icon = true, loading = false } = {}) {
  $("head").textContent = head;
  $("sub").textContent = sub;
  $("icon").toggleAttribute("hidden", !icon); // SVG elements have no .hidden property
  $("bar").hidden = !loading;
  drop.disabled = loading;
}
function say(text, err = false) {
  msg.className = "msg" + (err ? " err" : "");
  msg.textContent = text;
}
function reset() {
  if (url) { URL.revokeObjectURL(url); url = null; }
  get.hidden = true;
  view("Перетащите базу заказа К3", "или нажмите, чтобы выбрать .mdb");
}

async function upload(file) {
  if (!file || busy) return;
  reset();
  if (!/\.(mdb|accdb)$/i.test(file.name)) { say("Нужен файл .mdb или .accdb.", true); return; }
  if (file.size > 200 * 1048576) { say("Файл больше 200 МБ.", true); return; }

  busy = true;
  view(file.name, "Конвертирую…", { icon: false, loading: true });
  say("");
  const fd = new FormData();
  fd.append("file", file);
  try {
    const res = await fetch("api/convert", { method: "POST", body: fd });
    if (!res.ok) {
      let text = "Сервер ответил ошибкой " + res.status + ".";
      try { const j = await res.json(); if (j.detail) text = j.detail; } catch {}
      throw new Error(text);
    }
    const blob = await res.blob();
    const name = stem(file.name) + ".wsnin";
    url = URL.createObjectURL(blob);
    view(name, size(blob.size) + " · готов для ASAI Nest", { icon: false });
    get.href = url;
    get.download = name;
    $("getText").textContent = "Скачать " + name;
    get.hidden = false;
    get.click();
    say("Следующий заказ — просто перетащите сюда.");
  } catch (e) {
    reset();
    say(e instanceof TypeError ? "Нет связи с сервером." : e.message, true);
  } finally {
    busy = false;
  }
}

drop.addEventListener("click", () => { if (!busy) input.click(); });
input.addEventListener("change", () => { upload(input.files[0]); input.value = ""; });
["dragenter", "dragover"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); if (!busy) drop.classList.add("over"); }));
["dragleave", "drop"].forEach((t) => document.addEventListener(t, (e) => { e.preventDefault(); if (t === "drop" || !e.relatedTarget) drop.classList.remove("over"); }));
document.addEventListener("drop", (e) => upload(e.dataTransfer.files[0]));
</script>
</body>
</html>
